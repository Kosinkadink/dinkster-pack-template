[project]
name = "my-pack"
version = "0.1.0"
description = "A Dinkster node pack"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_pack"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "my_pack/dinkster-pack.toml"
"docs" = "my_pack/docs"

[dependency-groups]
dev = [
    "dinkster-api==0.0.3",
    "dinkster-engine==0.0.3",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "pyright>=1.1.390,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
