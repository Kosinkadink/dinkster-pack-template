name: Pack checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv build --wheel
      - name: Test the built wheel, not the editable source
        run: |
          uv pip install --no-deps --reinstall dist/*.whl
          uv run --no-sync pytest -q
          uv run --no-sync dinkster-doctor .
          package=$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("dinkster-pack.toml", "rb"))["pack"]["name"].replace("-", "_").replace(".", "_"))')
          uv run --no-sync dinkster-doctor ".venv/lib/python3.12/site-packages/$package/dinkster-pack.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') && github.repository != 'Kosinkadink/dinkster-pack-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Submit and report candidate state
        env:
          DINKSTER_REGISTRY_TOKEN: ${{ secrets.DINKSTER_REGISTRY_TOKEN }}
          DINKSTER_REGISTRY_URL: ${{ vars.DINKSTER_REGISTRY_URL }}
        run: python tools/publish.py dist/*.whl --registry "$DINKSTER_REGISTRY_URL"
