[pack]
# Canonical lowercase distribution name; must match pyproject.toml exactly.
name = "maple-text"
# Public PEP 440 release; must match the wheel metadata and submitted version.
version = "0.1.0"
# The lower bound is the first engine version providing the APIs imported here.
engine = ">=0.0.2,<0.1"
# Every node id must fall under a claimed namespace. Use your own pack name.
namespaces = ["maple-text"]
# Runtime Python dependencies must match the wheel's Requires-Dist, pinned exactly.
# The host supplies dinkster_api.v1; this example needs no extra dependencies.
requires = []

[pack.contracts]
# Host and API contract identifiers are required for native packs.
host = "dinkster-pack-host/1"
api = "dinkster-api/v1"

[pack.entry]
# Entries belong to the one package obtained by replacing '-' and '.' with '_'.
nodes = "maple_text:NODES"

[pack.sandbox]
# Requests are not grants. This node requires no privileged resources.
gpu = false
network = false
writable-mounts = false

[pack.docs]
# Documentation paths are relative to the packaged manifest.
dir = "docs"
default_locale = "en"
